<script>
/* bcEdgeColors — the colours the app background actually has along its
   right and bottom edges: the base gradient (125deg, --fxb1 → --fxb2 38% →
   --fxb3 70% → --fxb1) at those points, darkened by the vignette where it
   is on (an ellipse 110% × 90% of the window, clear to 35%, 50% black at
   its rim). Five samples per edge, top→bottom and left→right.
   Used for whatever has to stand in for the page beyond its edge while the
   window is growing faster than the page can follow: the host's fill
   colour (`mid`), and the continuation painted past the page during an
   oversized drag (see the LIVE WINDOW RESIZE controller). Getting this
   right matters — a flat average darkened by guesswork is what showed as
   a black band. */
window.bcEdgeColors = function (b1, b2, b3, vignette, W, H) {
  try {
    var ctx = null;
    var rgb = function (c) {
      c = String(c || '').trim();
      var m = /^#([0-9a-f]{6})$/i.exec(c);
      if (!m) {
        if (!ctx) ctx = document.createElement('canvas').getContext('2d');
        ctx.fillStyle = '#000000'; ctx.fillStyle = c || '#000000';
        m = /^#([0-9a-f]{6})$/i.exec(String(ctx.fillStyle));
        if (!m) return null;
      }
      var n = parseInt(m[1], 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    };
    var c1 = rgb(b1); if (!c1) return null;
    var c2 = rgb(b2) || c1, c3 = rgb(b3) || c2;
    W = Math.max(1, W || 1); H = Math.max(1, H || 1);
    var dx = Math.sin(125 * Math.PI / 180), dy = -Math.cos(125 * Math.PI / 180);
    var L = Math.abs(W * dx) + Math.abs(H * dy);
    var stops = [[0, c1], [0.38, c2], [0.70, c3], [1, c1]];
    var lerp = function (a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
    var at = function (x, y) {
      var t = 0.5 + ((x - W / 2) * dx + (y - H / 2) * dy) / L;
      t = Math.max(0, Math.min(1, t));
      var col = c1;
      for (var i = 1; i < stops.length; i++) {
        if (t <= stops[i][0]) {
          var a = stops[i - 1], b = stops[i];
          col = lerp(a[1], b[1], (t - a[0]) / Math.max(1e-6, b[0] - a[0]));
          break;
        }
      }
      var k = 1;
      if (vignette) {
        var ex = (x - W / 2) / (1.1 * W), ey = (y - H / 2) / (0.9 * H);
        var d = Math.sqrt(ex * ex + ey * ey);
        var al = d <= 0.35 ? 0 : d >= 1 ? 0.5 : (d - 0.35) / 0.65 * 0.5;
        k = 1 - al;
      }
      return '#' + col.map(function (v) {
        var n = Math.max(0, Math.min(255, Math.round(v * k)));
        return (n < 16 ? '0' : '') + n.toString(16);
      }).join('');
    };
    var right = [], bottom = [];
    for (var i = 0; i <= 4; i++) {
      right.push(at(W - 1, (H - 1) * i / 4));
      bottom.push(at((W - 1) * i / 4, H - 1));
    }
    return { right: right, bottom: bottom, mid: right[2] };
  } catch (e) { return null; }
};

     a per-load timestamp, so a deploy is picked up on the next launch no
     matter what a browser, proxy or CDN would like to cache.

         another), then execute in the original order.

         file's exact source text. An unchanged file skips compilation
         entirely; a changed file (even by one byte) is recompiled. One cache
         slot per filename, so the cache never grows.

         least one file actually needs compiling — normally just the first
         launch after a deploy.

<script>

  // executes each in order in the global scope (same as the original single
  // file), so any binding declared in one is visible to those that follow.
  // Order matters: each file may reference names from earlier files at
  // module-load time, but never the other way around.
  //   bot-core         pure utilities (api, markdown, splits)
  //   bot-stores       all global stores + their useXxx hooks
  //   bot-scheduler    deferred-action queue (time maths, policy, runtime)
  //   bot-engine       AI reply pipeline, products, payments, invoices
  //   bot-ui-enduser   the customer-profile popup (self-contained)
  //   bot-ui-shared    icons, avatars, ChatBubbleRow, ChatWindow, InPageChat
  //   bot-ui-views     MsgList, Dashboard, Agents, Products, Licenses
  //   bot-ui-settings  Settings sheet, Sidebar, Login, AccountChip
  //   bot-app          App component + ReactDOM mount

    'tweaks-panel.jsx',
    'bot-core.jsx',
    'bot-stores.jsx',
    'bot-scheduler.jsx',
    'bot-engine.jsx',
    'bot-ui-enduser.jsx',
    'bot-ui-shared.jsx',
    'bot-ui-widgets.jsx',
    'bot-ui-views.jsx',
    'bot-ui-settings.jsx',
    'bot-app.jsx',
  ];

  const BABEL_SRI = 'sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y';

      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);

    } catch (e) {
      console.warn('[jsx-loader] background compile unavailable, compiling on the page', e && e.message);
      if (babelUrl) URL.revokeObjectURL(babelUrl);
      return;
    }
    const cores = Math.max(1, (navigator.hardwareConcurrency || 2) - 1);
    const n = Math.max(1, Math.min(4, cores, needs.length));
    const lanes = Array.from({ length: n }, () => ({ load: 0, jobs: [] }));
    needs.slice().sort((a, b) => b.src.length - a.src.length).forEach((r) => {
      const lane = lanes.reduce((m, l) => (l.load < m.load ? l : m));
      lane.jobs.push(r); lane.load += r.src.length;
    });
    await Promise.all(lanes.map((lane) => new Promise((resolve) => {
      let w;
      try { w = new Worker(workerUrl); } catch (e) { resolve(); return; }
      let i = 0;
      const done = () => { try { w.terminate(); } catch (_) {} resolve(); };
      const next = () => {
        if (i >= lane.jobs.length) { done(); return; }
        const r = lane.jobs[i++];
        w.postMessage({ src: r.src, f: r.f });
      };
      w.onmessage = (e) => {
        const r = lane.jobs[i - 1], d = e.data || {};
        if (typeof d.out === 'string') {
          r.code = d.out;
          idbPut(r.f, { hash: r.hash, tag: COMPILER_TAG, code: d.out, at: Date.now() });
        } else {
          console.warn('[jsx-loader] background compile failed for', r.f, d.err);
        }
        next();
      };
      w.onerror = (e) => { try { e.preventDefault(); } catch (_) {} done(); };
      next();
    })));
    URL.revokeObjectURL(workerUrl);
    URL.revokeObjectURL(babelUrl);
  };
  try { await compileInWorkers(results); } catch (e) { console.warn('[jsx-loader] background compile error', e); }

  // Anything still uncompiled (no workers, or one failed) goes the old way.
  if (results.some(r => !r.err && r.code == null)) await ensureBabel();

  // 3. Execute in order.
  for (const r of results) {
    const f = r.f;
    try {
      if (r.err) throw r.err;
      let out = r.code;
      if (out == null) {
        if (!window.Babel && !(await ensureBabel())) throw new Error('Babel unavailable for ' + f);
        out = Babel.transform(r.src, {
          presets: ['react'],
          sourceType: 'script',
          filename: f,
        }).code;
        idbPut(f, { hash: r.hash, tag: COMPILER_TAG, code: out, at: Date.now() });
      }
      // Inject the transformed code as an inline <script> so it executes
      // in the GLOBAL scope (the way the original static <script> tag
      // would have). Inline scripts run synchronously the moment they're
      // appended, so by the time the next iteration of the loop runs,
      // any globals declared here are already on `window`.
      const tag = document.createElement('script');
      tag.textContent = out + '\n//# sourceURL=' + f;
      document.body.appendChild(tag);
    } catch (e) {
      // Soft-fail: a missing file (e.g. a module not yet copied into
      // the preview tree) shouldn't take down the whole app. Skip and
      // continue so partial previews still render whatever IS available.
      const is404 = /HTTP 404/.test(String(e && e.message));
      if (is404) {
        console.warn('[jsx-loader] skipped (not found):', f);
      } else {
        console.error('[jsx-loader] failed:', f, e);
      }
      continue;
    }
  }
})();
</script>
